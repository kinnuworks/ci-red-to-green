name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8,<9"
      - run: python -m pytest -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
  demo-sample:
    # The bundled /ci demo sample must stay red: it carries humanize's real bug #329.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8,<9"
      - run: |
          cd demo/humanize_mini
          if python -m pytest -q; then echo "the demo sample should fail"; exit 1; fi
          python -m pytest -q 2>&1 | grep -q "4 failed, 13 passed"
  hermes-e2e:
    # Loads the plugin through Hermes's real plugin manager (Hermes v0.23.1, installed from its own
    # uv.lock) and drives its hooks through /ci demo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 3b421578588243f920886e6fe79a6faa87ea026e
          path: _hermes
      - uses: astral-sh/setup-uv@v6
      - run: cd _hermes && uv sync --frozen --python 3.14
      - run: uv pip install --python _hermes/.venv/bin/python "pytest>=8,<9"
      - run: _hermes/.venv/bin/python -m pytest -q tests/test_hermes_e2e.py
        env:
          HERMES_AGENT_DIR: ${{ github.workspace }}/_hermes
